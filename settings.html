<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - EMProb Map Portal</title>
    
<style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #F5F7FA 0%, #E4E9F2 100%);
            min-height: 100vh;
            color: #2C3E50;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: linear-gradient(135deg, #FFFFFF 0%, #F8FAFC 100%);
            border-bottom: 2px solid #259FDE;
            box-shadow: 0 2px 15px rgba(37, 159, 222, 0.1);
            height: 80px;
        }

        .left-section {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            height: 100%;
        }

        .logo {
            height: 90%;
            width: auto;
            max-height: 50px;
        }

        .site-name {
            font-size: 28px;
            font-weight: bold;
            background: linear-gradient(135deg, #259FDE 0%, #0E3CBD 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .user-profile {
            position: relative;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(37, 159, 222, 0.08);
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid rgba(37, 159, 222, 0.3);
            transition: all 0.3s ease;
        }

        .user-info:hover {
            background: rgba(37, 159, 222, 0.15);
            transform: translateY(-2px);
        }

        .user-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #259FDE 0%, #0E3CBD 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            color: white;
            overflow: hidden;
            border: 2px solid rgba(37, 159, 222, 0.3);
            box-shadow: 0 2px 8px rgba(37, 159, 222, 0.2);
        }

        .user-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .user-details {
            display: flex;
            flex-direction: column;
        }

        .username {
            font-weight: 700;
            font-size: 16px;
            color: #2C3E50;
        }

        .email {
            font-size: 13px;
            color: #7F8C8D;
        }

        .profile-dropdown {
            position: absolute;
            top: 100%;
            right: 0;
            background: white;
            border: 1px solid #259FDE;
            border-radius: 12px;
            padding: 10px 0;
            margin-top: 10px;
            min-width: 220px;
            box-shadow: 0 5px 20px rgba(37, 159, 222, 0.15);
            z-index: 1000;
            display: none;
            backdrop-filter: blur(10px);
        }

        .profile-dropdown.active {
            display: block;
        }

        .dropdown-item {
            padding: 12px 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #2C3E50;
            font-weight: 500;
        }

        .dropdown-item:hover {
            background: linear-gradient(135deg, rgba(37, 159, 222, 0.1) 0%, rgba(14, 60, 189, 0.1) 100%);
            color: #259FDE;
        }

        .dropdown-item.active {
            background: linear-gradient(135deg, rgba(37, 159, 222, 0.15) 0%, rgba(14, 60, 189, 0.15) 100%);
            color: #259FDE;
            font-weight: 600;
        }

        .dropdown-item.logout {
            color: #E74C3C;
            border-top: 1px solid #ECF0F1;
            margin-top: 5px;
            padding-top: 15px;
        }

        .dropdown-item.logout:hover {
            background: rgba(231, 76, 60, 0.1);
        }

        /* Main Content Styles */
        .main-content {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .page-title {
            font-size: 36px;
            font-weight: 800;
            background: linear-gradient(135deg, #259FDE 0%, #0E3CBD 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 30px;
            text-align: center;
            letter-spacing: -0.5px;
        }

        .settings-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
            max-width: 800px;
            margin: 0 auto;
        }

        /* Card Styles */
        .settings-card {
            background: white;
            border-radius: 18px;
            padding: 35px;
            border: 2px solid rgba(37, 159, 222, 0.2);
            box-shadow: 0 8px 25px rgba(37, 159, 222, 0.1);
            position: relative;
            overflow: hidden;
        }

        .settings-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(135deg, #259FDE 0%, #0E3CBD 100%);
        }

        .card-title {
            font-size: 24px;
            font-weight: 700;
            color: #2C3E50;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 2px solid rgba(37, 159, 222, 0.2);
        }

        /* Form Styles */
        .form-group {
            margin-bottom: 30px;
        }

        .form-label {
            display: block;
            margin-bottom: 15px;
            font-size: 18px;
            font-weight: 600;
            color: #2C3E50;
        }

        .radio-group {
            display: flex;
            gap: 40px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 12px 20px;
            border-radius: 10px;
            border: 2px solid transparent;
            background: rgba(37, 159, 222, 0.05);
        }

        .radio-option:hover {
            background: rgba(37, 159, 222, 0.1);
            border-color: rgba(37, 159, 222, 0.3);
            transform: translateY(-2px);
        }

        .radio-option input[type="radio"] {
            display: none;
        }

        .radio-custom {
            width: 22px;
            height: 22px;
            border: 2px solid #ECF0F1;
            border-radius: 50%;
            position: relative;
            transition: all 0.3s ease;
            background: white;
        }

        .radio-option input[type="radio"]:checked + .radio-custom {
            border-color: #259FDE;
            background: white;
        }

        .radio-option input[type="radio"]:checked + .radio-custom::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 10px;
            height: 10px;
            background: #259FDE;
            border-radius: 50%;
        }

        .radio-text {
            font-size: 16px;
            color: #2C3E50;
            font-weight: 500;
        }

        /* Button Styles */
        .btn-group {
            display: flex;
            gap: 20px;
            margin-top: 40px;
        }

        .btn {
            padding: 16px 32px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .btn-primary {
            background: linear-gradient(135deg, #259FDE 0%, #0E3CBD 100%);
            color: white;
            flex: 1;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(37, 159, 222, 0.3);
        }

        .btn-secondary {
            background: white;
            border: 2px solid #259FDE;
            color: #259FDE;
            flex: 1;
        }

        .btn-secondary:hover {
            background: rgba(37, 159, 222, 0.1);
            transform: translateY(-3px);
        }

        .btn-tertiary {
            background: linear-gradient(135deg, #E74C3C 0%, #C0392B 100%);
            color: white;
            width: 100%;
            margin-top: 10px;
        }

        .btn-tertiary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(231, 76, 60, 0.3);
        }

        .btn-icon {
            width: 20px;
            height: 20px;
        }

        /* Status Messages */
        .status-message {
            padding: 18px;
            border-radius: 12px;
            margin-bottom: 25px;
            display: none;
            font-weight: 600;
            border: 2px solid;
        }

        .status-success {
            background: rgba(46, 204, 113, 0.1);
            border-color: #2ECC71;
            color: #2ECC71;
            display: block;
        }

        .status-error {
            background: rgba(231, 76, 60, 0.1);
            border-color: #E74C3C;
            color: #E74C3C;
            display: block;
        }

        .status-info {
            background: rgba(37, 159, 222, 0.1);
            border-color: #259FDE;
            color: #259FDE;
            display: block;
        }

        /* Loading Screen */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #F5F7FA 0%, #E4E9F2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(37, 159, 222, 0.2);
            border-top: 4px solid #259FDE;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            box-shadow: 0 2px 10px rgba(37, 159, 222, 0.2);
        }

        .loading-text {
            margin-top: 25px;
            font-size: 18px;
            color: #2C3E50;
            font-weight: 600;
        }

        /* Toggle Switch for Notifications */
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
            margin-right: 15px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 34px;
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .toggle-slider {
            background: linear-gradient(135deg, #259FDE 0%, #0E3CBD 100%);
        }

        input:checked + .toggle-slider:before {
            transform: translateX(26px);
        }

        .toggle-label {
            display: flex;
            align-items: center;
            font-size: 16px;
            color: #2C3E50;
            font-weight: 500;
        }

        .toggle-container {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .toggle-icon {
            width: 20px;
            height: 20px;
            margin-right: 10px;
            color: #259FDE;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: white;
            border-radius: 18px;
            padding: 40px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal {
            transform: translateY(0);
        }

        .modal-title {
            font-size: 28px;
            font-weight: 700;
            color: #2C3E50;
            margin-bottom: 25px;
            text-align: center;
        }

        .modal-form-group {
            margin-bottom: 25px;
        }

        .modal-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2C3E50;
        }

        .modal-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #E4E9F2;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .modal-input:focus {
            outline: none;
            border-color: #259FDE;
            box-shadow: 0 0 0 3px rgba(37, 159, 222, 0.2);
        }

        .modal-buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .modal-btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .modal-btn-primary {
            background: linear-gradient(135deg, #259FDE 0%, #0E3CBD 100%);
            color: white;
        }

        .modal-btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(37, 159, 222, 0.3);
        }

        .modal-btn-secondary {
            background: white;
            border: 2px solid #259FDE;
            color: #259FDE;
        }

        .modal-btn-secondary:hover {
            background: rgba(37, 159, 222, 0.1);
            transform: translateY(-2px);
        }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            font-size: 24px;
            color: #7F8C8D;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .close-modal:hover {
            color: #E74C3C;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .header {
                padding: 12px 20px;
                height: 70px;
            }
            
            .left-section {
                gap: 15px;
            }
            
            .site-name {
                font-size: 24px;
            }
            
            .user-info {
                padding: 10px 15px;
            }
            
            .user-details {
                display: none;
            }
            
            .page-title {
                font-size: 32px;
            }
            
            .settings-card {
                padding: 25px;
                border-radius: 15px;
            }
            
            .card-title {
                font-size: 22px;
            }
            
            .radio-group {
                gap: 20px;
            }
            
            .btn-group {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
            }
            
            .modal {
                padding: 30px 20px;
                width: 95%;
            }
            
            .modal-buttons {
                flex-direction: column;
            }
        }

        @media (max-width: 480px) {
            .site-name {
                font-size: 20px;
            }
            
            .left-section {
                gap: 10px;
            }
            
            .page-title {
                font-size: 28px;
            }
            
            .settings-card {
                padding: 20px;
            }
            
            .card-title {
                font-size: 20px;
            }
            
            .radio-group {
                flex-direction: column;
                gap: 15px;
            }
            
            .radio-option {
                padding: 10px 15px;
            }
            
            .form-label {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="loading-screen" id="loadingScreen">
        <div class="spinner"></div>
        <div class="loading-text">Loading Settings...</div>
    </div>

    <!-- Password Change Modal -->
    <div class="modal-overlay" id="passwordModal">
        <div class="modal">
            <button class="close-modal" id="closePasswordModal">&times;</button>
            <h2 class="modal-title">Change Password</h2>
            
            <div class="status-message" id="passwordChangeStatus"></div>
            
            <div class="modal-form-group">
                <label class="modal-label">Current Password</label>
                <input type="password" class="modal-input" id="currentPassword" placeholder="Enter your current password">
            </div>
            
            <div class="modal-form-group">
                <label class="modal-label">New Password</label>
                <input type="password" class="modal-input" id="newPassword" placeholder="Enter new password">
            </div>
            
            <div class="modal-form-group">
                <label class="modal-label">Confirm New Password</label>
                <input type="password" class="modal-input" id="confirmNewPassword" placeholder="Confirm new password">
            </div>
            
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-secondary" id="cancelPasswordChange">Cancel</button>
                <button class="modal-btn modal-btn-primary" id="saveNewPassword">Change Password</button>
            </div>
        </div>
    </div>

    <div class="header" style="display: none;" id="mainHeader">
        <!-- Left Section: Logo + EMProb -->
        <div class="left-section">
            <div class="logo-container">
                <img src="https://em-prob.vercel.app/mainlogo.png" alt="EMProb Logo" class="logo">
            </div>
            <div class="site-name">EMProb</div>
        </div>

        <!-- Right Section: User Profile -->
        <div class="user-profile" id="userProfile">
            <div class="user-info">
                <div class="user-avatar" id="userAvatar">
                    <!-- Profile picture will be inserted here by JavaScript -->
                </div>
                <div class="user-details">
                    <div class="username" id="usernameDisplay">John Doe</div>
                    <div class="email" id="emailDisplay">john.doe@example.com</div>
                </div>
            </div>
            <div class="profile-dropdown" id="profileDropdown">
                <div class="dropdown-item" onclick="location.href='dashboard.html'">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                        <path d="M0 0v8h8V0H0zm1 1h6v6H1V1zm8-1v4h8V0H9zm0 5v8h8V5H9zm-8 5v4h8v-4H1zm1 1h6v2H2v-2z"/>
                    </svg>
                    Dashboard
                </div>
                <div class="dropdown-item" onclick="location.href='profile.html'">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                        <path d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0zm0 2a3 3 0 1 1 0 6 3 3 0 0 1 0-6zm0 12a7.5 7.5 0 0 1-5-1.9C3.5 11 5 9 8 9s4.5 2 5 3.1A7.5 7.5 0 0 1 8 14z"/>
                    </svg>
                    My Profile
                </div>
                <div class="dropdown-item active">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                        <path d="M7 2v6h2V2h-2zm5 10v-2H4v2H2v2h12v-2h-2z"/>
                    </svg>
                    Settings
                </div>
                <div class="dropdown-item" onclick="location.href='probationers.html'">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                        <path d="M12 0H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2zM6 2h4v2H6V2zm0 4h4v2H6V6zm0 4h4v2H6v-2zm6 4H6v-2h6v2zm0-4H10V8h2v2zm0-4H10V4h2v2z"/>
                    </svg>
                    Probationers
                </div>
                <div class="dropdown-item" onclick="location.href='interface.html'">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                        <path d="M0 0v16h16V0H0zm15 15H1V1h14v14zM2 2h12v12H2V2zm4 2H4v8h2V4zm2 0h2v8H8V4zm4 0h2v8h-2V4z"/>
                    </svg>
                    Map View
                </div>
                <div class="dropdown-item logout" id="logoutBtn">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                        <path d="M7 1v6h2V1H7zM2 7h4v2H2v4h12V9h-4V7h4a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z"/>
                    </svg>
                    Logout
                </div>
            </div>
        </div>
    </div>
    
    <div class="main-content" style="display: none;" id="mainContent">
        <h1 class="page-title">Settings</h1>
        
        <div class="settings-container">
            <!-- Basic Settings Card -->
            <div class="settings-card">
                <h2 class="card-title">Basic Settings</h2>
                
                <div class="form-group">
                    <div class="toggle-container">
                        <label class="toggle-label">
                            <span class="toggle-icon">
                                <svg viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
                                </svg>
                            </span>
                            Notification Preferences
                        </label>
                        <label class="toggle-switch">
                            <input type="checkbox" id="notificationToggle">
                            <span class="toggle-slider"></span>
                        </label>
                        <span id="notificationStatusText">Sound</span>
                    </div>
                </div>
                
                <div class="btn-group">
                    <button class="btn btn-primary" id="changePasswordBtn">
                        <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                        </svg>
                        Change Password
                    </button>
                    
                    <button class="btn btn-tertiary" id="logoutButton">
                        <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/>
                        </svg>
                        Logout
                    </button>
                </div>
            </div>
            
            <!-- Default Map Settings Card -->
            <div class="settings-card">
                <h2 class="card-title">Default Map Settings</h2>
                
                <div class="form-group">
                    <label class="form-label">Select Default Map Layer</label>
                    <div class="radio-group">
                        <label class="radio-option">
                            <input type="radio" name="defaultMap" value="streets" id="streetsRadio">
                            <span class="radio-custom"></span>
                            <span class="radio-text">Streets</span>
                        </label>
                        
                        <label class="radio-option">
                            <input type="radio" name="defaultMap" value="satellite" id="satelliteRadio">
                            <span class="radio-custom"></span>
                            <span class="radio-text">Satellite</span>
                        </label>
                        
                        <label class="radio-option">
                            <input type="radio" name="defaultMap" value="terrain" id="terrainRadio">
                            <span class="radio-custom"></span>
                            <span class="radio-text">Terrain</span>
                        </label>
                    </div>
                </div>
                
                <div class="status-message" id="mapSettingsStatus"></div>
                
                <div class="btn-group">
                    <button class="btn btn-primary" id="saveMapSettingsBtn">
                        <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/>
                        </svg>
                        Save Map Settings
                    </button>
                    
                    <button class="btn btn-secondary" onclick="location.href='interface.html'">
                        <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
                        </svg>
                        Back to Map
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        // Import the functions you need from the SDKs you need
        import { initializeApp as initializeFirebase } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
        import { getDatabase, ref, set, get, update } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-database.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";

        // Your web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBGONaynbM6GSdq4Ee46dD8tqfeCYx-w-M",
            authDomain: "probationlocator.firebaseapp.com",
            databaseURL: "https://probationlocator-default-rtdb.firebaseio.com",
            projectId: "probationlocator",
            storageBucket: "probationlocator.firebasestorage.app",
            messagingSenderId: "323066331183",
            appId: "1:323066331183:web:61f35b70cb07c0618106da"
        };

        // Initialize Firebase
        const app = initializeFirebase(firebaseConfig);
        const database = getDatabase(app);
        const auth = getAuth(app);

        // Authentication check function
        function checkAuth() {
            const username = localStorage.getItem('emprobUsername');
            if (!username) {
                window.location.href = 'index.html';
            }
            return username;
        }

        // Get user data from Firebase
        async function getUserData(username) {
            try {
                const userRef = ref(database, 'credentials/' + username);
                const snapshot = await get(userRef);
                
                if (snapshot.exists()) {
                    return snapshot.val();
                } else {
                    console.error('User data not found in Firebase');
                    return null;
                }
            } catch (error) {
                console.error('Error fetching user data:', error);
                return null;
            }
        }

        // Save settings to Firebase
        async function saveSettings(username, settings) {
            try {
                const settingsRef = ref(database, 'settings/' + username);
                await set(settingsRef, settings);
                return true;
            } catch (error) {
                console.error('Error saving settings:', error);
                return false;
            }
        }

        // Load settings from Firebase
        async function loadSettings(username) {
            try {
                const settingsRef = ref(database, 'settings/' + username);
                const snapshot = await get(settingsRef);
                
                if (snapshot.exists()) {
                    return snapshot.val();
                } else {
                    // Return default settings if none exist
                    return {
                        defaultMap: 'streets',
                        notificationSound: true,
                        lastUpdated: new Date().toISOString()
                    };
                }
            } catch (error) {
                console.error('Error loading settings:', error);
                return null;
            }
        }

        // Update user password in Firebase
        async function updatePassword(username, newPassword) {
            try {
                const userRef = ref(database, 'credentials/' + username);
                
                // Get current user data
                const snapshot = await get(userRef);
                if (!snapshot.exists()) {
                    return { success: false, message: 'User not found' };
                }
                
                const userData = snapshot.val();
                
                // Update password
                userData.password = newPassword;
                
                // Save back to Firebase
                await set(userRef, userData);
                return { success: true, message: 'Password updated successfully' };
            } catch (error) {
                console.error('Error updating password:', error);
                return { success: false, message: 'Error updating password' };
            }
        }

        // Verify current password
        async function verifyPassword(username, password) {
            try {
                const userRef = ref(database, 'credentials/' + username);
                const snapshot = await get(userRef);
                
                if (snapshot.exists()) {
                    const userData = snapshot.val();
                    return userData.password === password;
                }
                return false;
            } catch (error) {
                console.error('Error verifying password:', error);
                return false;
            }
        }

        // Initialize the application
        async function initApplication() {
            const username = checkAuth();
            
            if (!username) {
                return;
            }

            try {
                // Authenticate anonymously with Firebase
                await signInAnonymously(auth);
                console.log("Anonymous authentication successful");

                // Get user data from Firebase
                const userData = await getUserData(username);
                
                if (userData) {
                    // Update UI with user data
                    document.getElementById('usernameDisplay').textContent = userData.username;
                    document.getElementById('emailDisplay').textContent = userData.email;
                    
                    // Update user avatar with profile picture from Firebase
                    const userAvatar = document.getElementById('userAvatar');
                    
                    if (userData.profilePicture && userData.profilePicture.trim() !== '') {
                        // Create an img element for the base64 profile picture
                        const profileImg = document.createElement('img');
                        profileImg.src = userData.profilePicture;
                        profileImg.alt = userData.username + "'s profile picture";
                        profileImg.style.width = '100%';
                        profileImg.style.height = '100%';
                        profileImg.style.objectFit = 'cover';
                        
                        // Clear any existing content and add the image
                        userAvatar.innerHTML = '';
                        userAvatar.appendChild(profileImg);
                    } else {
                        // If no profile picture, show initials as fallback
                        userAvatar.textContent = userData.username.charAt(0).toUpperCase();
                        userAvatar.style.display = 'flex';
                        userAvatar.style.alignItems = 'center';
                        userAvatar.style.justifyContent = 'center';
                        userAvatar.style.fontWeight = 'bold';
                        userAvatar.style.fontSize = '18px';
                        userAvatar.style.background = 'linear-gradient(135deg, #259FDE 0%, #0E3CBD 100%)';
                    }
                    
                    // Load user settings
                    const settings = await loadSettings(username);
                    if (settings) {
                        // Set radio button based on saved setting
                        if (settings.defaultMap) {
                            document.getElementById(`${settings.defaultMap}Radio`).checked = true;
                        }
                        
                        // Set notification toggle based on saved setting
                        const notificationToggle = document.getElementById('notificationToggle');
                        const notificationStatusText = document.getElementById('notificationStatusText');
                        
                        if (settings.notificationSound !== undefined) {
                            notificationToggle.checked = settings.notificationSound;
                            notificationStatusText.textContent = settings.notificationSound ? 'Sound' : 'Vibration';
                        }
                    }
                    
                    // Show the main interface
                    document.getElementById('loadingScreen').style.display = 'none';
                    document.getElementById('mainHeader').style.display = 'flex';
                    document.getElementById('mainContent').style.display = 'block';
                    
                    // Initialize event listeners
                    initializeEventListeners(username);
                } else {
                    // If user data not found, redirect to login
                    localStorage.removeItem('emprobUsername');
                    window.location.href = 'index.html';
                }
            } catch (error) {
                console.error("Initialization error:", error);
                document.getElementById('loadingScreen').innerHTML = `
                    <div style="text-align: center; color: #ff6b6b;">
                        <h3>Error Loading Application</h3>
                        <p>Please refresh the page or try again later.</p>
                    </div>
                `;
            }
        }

        // Initialize event listeners
        function initializeEventListeners(username) {
            // Profile dropdown functionality
            const userProfile = document.getElementById('userProfile');
            const profileDropdown = document.getElementById('profileDropdown');
            
            userProfile.addEventListener('click', function(e) {
                e.stopPropagation();
                profileDropdown.classList.toggle('active');
            });
            
            // Close dropdown when clicking outside
            document.addEventListener('click', function() {
                profileDropdown.classList.remove('active');
            });
            
            // Notification toggle functionality
            const notificationToggle = document.getElementById('notificationToggle');
            const notificationStatusText = document.getElementById('notificationStatusText');
            
            notificationToggle.addEventListener('change', async function() {
                const isSound = this.checked;
                notificationStatusText.textContent = isSound ? 'Sound' : 'Vibration';
                
                // Save notification preference
                const settingsRef = ref(database, 'settings/' + username);
                const currentSettings = await loadSettings(username);
                
                if (currentSettings) {
                    currentSettings.notificationSound = isSound;
                    currentSettings.lastUpdated = new Date().toISOString();
                    
                    const success = await saveSettings(username, currentSettings);
                    
                    if (success) {
                        console.log('Notification preference saved:', isSound ? 'Sound' : 'Vibration');
                    }
                }
            });
            
            // Save map settings
            document.getElementById('saveMapSettingsBtn').addEventListener('click', async function() {
                const selectedMap = document.querySelector('input[name="defaultMap"]:checked').value;
                
                const currentSettings = await loadSettings(username);
                const settings = {
                    ...currentSettings,
                    defaultMap: selectedMap,
                    lastUpdated: new Date().toISOString()
                };
                
                const statusElement = document.getElementById('mapSettingsStatus');
                statusElement.textContent = 'Saving settings...';
                statusElement.className = 'status-message status-info';
                statusElement.style.display = 'block';
                
                const success = await saveSettings(username, settings);
                
                if (success) {
                    statusElement.textContent = 'Settings saved successfully!';
                    statusElement.className = 'status-message status-success';
                    
                    // Hide message after 3 seconds
                    setTimeout(() => {
                        statusElement.style.display = 'none';
                    }, 3000);
                } else {
                    statusElement.textContent = 'Error saving settings. Please try again.';
                    statusElement.className = 'status-message status-error';
                }
            });
            
            // Password change modal functionality
            const passwordModal = document.getElementById('passwordModal');
            const changePasswordBtn = document.getElementById('changePasswordBtn');
            const closePasswordModal = document.getElementById('closePasswordModal');
            const cancelPasswordChange = document.getElementById('cancelPasswordChange');
            const saveNewPasswordBtn = document.getElementById('saveNewPassword');
            
            // Open password modal
            changePasswordBtn.addEventListener('click', function() {
                passwordModal.classList.add('active');
                // Clear previous inputs
                document.getElementById('currentPassword').value = '';
                document.getElementById('newPassword').value = '';
                document.getElementById('confirmNewPassword').value = '';
                document.getElementById('passwordChangeStatus').style.display = 'none';
            });
            
            // Close password modal
            function closePasswordModalFunc() {
                passwordModal.classList.remove('active');
            }
            
            closePasswordModal.addEventListener('click', closePasswordModalFunc);
            cancelPasswordChange.addEventListener('click', closePasswordModalFunc);
            
            // Save new password
            saveNewPasswordBtn.addEventListener('click', async function() {
                const currentPassword = document.getElementById('currentPassword').value;
                const newPassword = document.getElementById('newPassword').value;
                const confirmNewPassword = document.getElementById('confirmNewPassword').value;
                const statusElement = document.getElementById('passwordChangeStatus');
                
                // Validation
                if (!currentPassword || !newPassword || !confirmNewPassword) {
                    statusElement.textContent = 'Please fill in all fields';
                    statusElement.className = 'status-message status-error';
                    statusElement.style.display = 'block';
                    return;
                }
                
                if (newPassword !== confirmNewPassword) {
                    statusElement.textContent = 'New passwords do not match';
                    statusElement.className = 'status-message status-error';
                    statusElement.style.display = 'block';
                    return;
                }
                
                if (newPassword.length < 6) {
                    statusElement.textContent = 'Password must be at least 6 characters';
                    statusElement.className = 'status-message status-error';
                    statusElement.style.display = 'block';
                    return;
                }
                
                // Verify current password
                const isPasswordCorrect = await verifyPassword(username, currentPassword);
                if (!isPasswordCorrect) {
                    statusElement.textContent = 'Current password is incorrect';
                    statusElement.className = 'status-message status-error';
                    statusElement.style.display = 'block';
                    return;
                }
                
                // Update password
                statusElement.textContent = 'Updating password...';
                statusElement.className = 'status-message status-info';
                statusElement.style.display = 'block';
                
                const result = await updatePassword(username, newPassword);
                
                if (result.success) {
                    statusElement.textContent = 'Password updated successfully!';
                    statusElement.className = 'status-message status-success';
                    
                    // Clear form and close modal after 2 seconds
                    setTimeout(() => {
                        closePasswordModalFunc();
                        document.getElementById('currentPassword').value = '';
                        document.getElementById('newPassword').value = '';
                        document.getElementById('confirmNewPassword').value = '';
                        statusElement.style.display = 'none';
                    }, 2000);
                } else {
                    statusElement.textContent = result.message;
                    statusElement.className = 'status-message status-error';
                }
            });
            
            // Logout functionality
            const logoutButtons = [document.getElementById('logoutBtn'), document.getElementById('logoutButton')];
            
            logoutButtons.forEach(button => {
                if (button) {
                    button.addEventListener('click', function() {
                        if (confirm('Are you sure you want to logout?')) {
                            localStorage.removeItem('emprobUsername');
                            window.location.href = 'index.html';
                        }
                    });
                }
            });
            
            // Close modal when clicking outside
            passwordModal.addEventListener('click', function(e) {
                if (e.target === passwordModal) {
                    closePasswordModalFunc();
                }
            });
        }

        // Call initialization when page loads
        document.addEventListener('DOMContentLoaded', initApplication);
    </script>
</body>
</html>
