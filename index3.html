<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Square Clock</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0E3CBD 0%, #1C1C1C 50%, #0E3CBD 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #FFFFFF;
            overflow: hidden;
        }

        .clock-container {
            width: 100vmin;
            height: 100vmin;
            max-width: 100vh;
            max-height: 100vw;
            background: #1C1C1C;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: 
                inset 0 0 0 2px rgba(37, 159, 222, 0.2),
                0 0 50px rgba(0, 0, 0, 0.8);
        }

/* PREFIX - Combined Status Container (INCREASED SPACING BY 50%) */
.combined-status {
    position: absolute;
    top: 7.5vmin;        /* SUFFIX: 5vmin × 1.5 = 7.5vmin (50% more from top) */
    right: 7.5vmin;      /* SUFFIX: 5vmin × 1.5 = 7.5vmin (50% more from right) */
    display: flex;
    align-items: center;
    z-index: 100;
    background: rgba(28, 28, 28, 0.95);
    padding: 3vmin;      /* SUFFIX: 2vmin × 1.5 = 3vmin (50% larger padding) */
    border-radius: 3.75vmin; /* SUFFIX: 2.5vmin × 1.5 = 3.75vmin */
    border: 2px solid rgba(37, 159, 222, 0.5);
    backdrop-filter: blur(10px);
}

.status-section {
    display: flex;
    align-items: center;
    gap: 2.25vmin;       /* SUFFIX: 1.5vmin × 1.5 = 2.25vmin (50% larger gap) */
    padding: 0 3vmin;    /* SUFFIX: 2vmin × 1.5 = 3vmin (50% larger padding) */
    height: 100%;
}

.status-divider {
    width: 1px;
    height: 7.5vmin;      /* SUFFIX: 5vmin × 1.5 = 7.5vmin (50% taller) */
    background: rgba(37, 159, 222, 0.3);
}

/* Blinking Circle */
.blinking-circle {
    width: 6vmin;
    height: 6vmin;
    border-radius: 50%;
    background-color: #259FDE; /* Starting color */
    margin-top: 4vmin;
    animation: blinkRedGreen 1s infinite alternate;
}

@keyframes blinkRedGreen {
    0% { background-color: #DE3725; } /* Red */
    100% { background-color: #25DE37; } /* Green */
}
        /* Period Indicator */
.period-indicator {
    font-size: 5.5vmin;
    font-weight: 900;
    color: #259FDE;
    font-family: 'Courier New', monospace;
    text-align: center;
    min-width: 15vmin;     /* SUFFIX: 10vmin × 1.5 = 15vmin (50% wider) */
    text-shadow: 0 0 1vmin rgba(37, 159, 222, 0.5);
}

        /* GPS Icon */
        .gps-icon {
            width: 5vmin;
            height: 5vmin;
            display: flex;
            align-items: center;
            justify-content: center;
        }

          .gps-text-icon {
            font-size: 4vmin;
            font-weight: bold;
            display: block;
            line-height: 1;
            text-align: center;
            width: 100%;
            height: 100%;
        }
        
        .gps-status {
            font-size: 4vmin;
            font-weight: 800;
            color: #FFFFFF;
            font-family: 'Courier New', monospace;
            min-width: 8vmin;
            text-align: center;
            text-shadow: 0 0 1vmin rgba(37, 159, 222, 0.5);
        }

.battery-icon {
    position: relative;
    width: 19.2vmin;        /* SUFFIX: 12vmin × 1.6 = 19.2vmin */
    height: 9.6vmin;        /* SUFFIX: 6vmin × 1.6 = 9.6vmin */
    background: rgba(94, 94, 94, 0.3);
    border-radius: 1.6vmin; /* SUFFIX: 1vmin × 1.6 = 1.6vmin */
    border: 3.2px solid #5E5E5E; /* SUFFIX: 2px × 1.6 = 3.2px */
    overflow: hidden;
}

.battery-fill {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    background: #259FDE;
    transition: width 0.5s ease, background 0.5s ease;
    border-radius: 1.28vmin; /* SUFFIX: 0.8vmin × 1.6 = 1.28vmin */
}
        
.charging-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, 
        transparent 0%, 
        rgba(255, 255, 255, 0.7) 50%, 
        transparent 100%);
    background-size: 200% 100%;
    animation: charging 1.5s infinite linear;
    display: none;
    border-radius: 1.28vmin; /* SUFFIX: 0.8vmin × 1.6 = 1.28vmin */
}

.battery-tip {
    position: absolute;
    right: -2.88vmin;       /* SUFFIX: 1.8vmin × 1.6 = 2.88vmin */
    top: 50%;
    transform: translateY(-50%);
    width: 2.88vmin;        /* SUFFIX: 1.8vmin × 1.6 = 2.88vmin */
    height: 4.48vmin;       /* SUFFIX: 2.8vmin × 1.6 = 4.48vmin */
    background: #5E5E5E;
    border-radius: 0 1.6vmin 1.6vmin 0; /* SUFFIX: 1vmin × 1.6 = 1.6vmin */
    border: 3.2px solid #5E5E5E; /* SUFFIX: 2px × 1.6 = 3.2px */
    border-left: none;
}
        
.battery-percentage {
    font-size: 8vmin;       /* SUFFIX: 5vmin × 1.6 = 8vmin */
    font-weight: 800;
    color: #FFFFFF;
    font-family: 'Courier New', monospace;
    min-width: 19.2vmin;    /* SUFFIX: 12vmin × 1.6 = 19.2vmin */
    text-align: right;
    text-shadow: 0 0 1.6vmin rgba(37, 159, 222, 0.5); /* SUFFIX: 1vmin × 1.6 = 1.6vmin */
}

.charging-icon {
    display: none;
    width: 8vmin;       /* SUFFIX: 5vmin × 1.6 = 8vmin */
    height: 8vmin;      /* SUFFIX: 5vmin × 1.6 = 8vmin */
    color: #259FDE;
    margin-left: 1.6vmin; /* SUFFIX: 1vmin × 1.6 = 1.6vmin */
}

        .charging-icon.active {
            display: block;
            animation: pulse 1.5s infinite;
        }

.clock-content {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    /* PREFIX - Add some padding if needed after size increase */
    padding: 6vmin; /* SUFFIX - Optional: Add padding for larger time */
    padding-top: 20%;
}

        /* Main Time Display */
        .time-display {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 3vmin;
        }

/* PREFIX - Time Display (INCREASED BY 30%) */
.time-digit {
    font-size: 41.6vmin;    /* SUFFIX: 32vmin × 1.3 = 41.6vmin */
    font-weight: 900;
    font-family: 'Times New Roman', Times, serif; /* Georgia removed */
    color: #FFFFFF;
    line-height: 1;
    height: 41.6vmin;       /* SUFFIX: 32vmin × 1.3 = 41.6vmin */
    display: flex;
    align-items: center;
    justify-content: center;
}

.time-colon {
    font-size: 26vmin;      /* SUFFIX: 20vmin × 1.3 = 26vmin */
    font-weight: 900;
    font-family: 'Times New Roman', Times, serif; /* Georgia removed */
    color: #259FDE;
    animation: blink 1.5s infinite;
    height: 41.6vmin;       /* SUFFIX: Match time-digit height (32vmin × 1.3) */
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 2.6vmin;      /* SUFFIX: 2vmin × 1.3 = 2.6vmin */
}

.hours, .minutes {
    width: 52vmin;           /* SUFFIX: 40vmin × 1.3 = 52vmin */
    text-align: center;
}

        /* Date Display */
        .date-display {
            font-size: 6vmin;
            color: #848484;
            letter-spacing: 0.5vmin;
            text-transform: uppercase;
            font-weight: 600;
            text-align: center;
            margin-top: 2vmin;
            width: 100%;
            padding: 0 5vmin;
        }

        /* Corner Accents */
        .corner {
            position: absolute;
            width: 12vmin;
            height: 12vmin;
            border: 2.5vmin solid #259FDE;
            opacity: 0.6;
        }

        .corner-tl {
            top: 5vmin;
            left: 5vmin;
            border-right: none;
            border-bottom: none;
        }

        .corner-tr {
            top: 5vmin;
            right: 5vmin;
            border-left: none;
            border-bottom: none;
        }

        .corner-bl {
            bottom: 5vmin;
            left: 5vmin;
            border-right: none;
            border-top: none;
        }

        .corner-br {
            bottom: 5vmin;
            right: 5vmin;
            border-left: none;
            border-top: none;
        }

        #idDisplay {
            position: fixed !important;
            bottom: 0vh !important;
            left: 50% !important;
            transform: translateX(-50%) !important;

            font-family: 'Courier New', monospace !important;
            font-size: 4.5vmin !important;
            font-weight: 900 !important;
            color: #259FDE !important;
            letter-spacing: 0.6vmin !important;
            text-shadow: 
                0 0 15px #0E3CBD,
                0 0 30px #259FDE !important;

            background: none !important;
            border: none !important;
            padding: 0 !important;
            margin: 0 !important;
            z-index: 99999 !important;
            pointer-events: none !important;
        }

        /* Status Indicator - bottom center */
        .status-indicator {
            position: absolute;
            bottom: 2vmin;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2vmin;
            color: #5E5E5E;
            text-align: center;
            opacity: 0.6;
        }

        /* Animations */
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.2); }
        }

        @keyframes charging {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        @keyframes batteryLow {
            0%, 100% { background-color: #259FDE; }
            50% { background-color: #DE3725; }
        }

        /* GPS icon animations */
        @keyframes gpsSearching {
            0%, 100% { opacity: 0.3; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.1); }
        }

        @keyframes gpsConnected {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }

@media (max-height: 500px) and (max-width: 500px) {
    .time-digit {
        font-size: 31.2vmin;    /* SUFFIX: 24vmin × 1.3 = 31.2vmin */

        font-family: 'Times New Roman', Times, serif; /* Georgia removed */
        font-weight: 900;
    }
}
            
.hours, .minutes {
    width: 39vmin;          /* SUFFIX: 30vmin × 1.3 = 39vmin */
}

            
/* PREFIX - Combined Status Container for small screens (INCREASED SPACING BY 50%) */
.combined-status {
    top: 4.5vmin;        /* SUFFIX: 3vmin × 1.5 = 4.5vmin */
    right: 4.5vmin;      /* SUFFIX: 3vmin × 1.5 = 4.5vmin */
    padding: 2.25vmin;   /* SUFFIX: 1.5vmin × 1.5 = 2.25vmin */
}
            
.status-section {
    gap: 1.5vmin;        /* SUFFIX: 1vmin × 1.5 = 1.5vmin */
    padding: 0 2.25vmin; /* SUFFIX: 1.5vmin × 1.5 = 2.25vmin */
}
            
.status-divider {
    height: 6vmin;        /* SUFFIX: 4vmin × 1.5 = 6vmin */
}
            
.period-indicator {
    font-size: 4.5vmin;
    min-width: 12vmin;     /* SUFFIX: 8vmin × 1.5 = 12vmin */
}
            
            /* GPS adjustments */
            .gps-icon {
                width: 4vmin;
                height: 4vmin;
            }
            
            .gps-status {
                font-size: 3vmin;
                min-width: 6vmin;
            }
            
            /* Battery adjustments */
  .battery-icon {
    width: 16vmin;      /* SUFFIX: 10vmin × 1.6 = 16vmin */
    height: 8vmin;      /* SUFFIX: 5vmin × 1.6 = 8vmin */
}
            
.battery-percentage {
    font-size: 6.4vmin; /* SUFFIX: 4vmin × 1.6 = 6.4vmin */
    min-width: 16vmin;  /* SUFFIX: 10vmin × 1.6 = 16vmin */
}

.battery-tip {
    right: -2.4vmin;    /* SUFFIX: 1.5vmin × 1.6 = 2.4vmin */
    width: 2.4vmin;     /* SUFFIX: 1.5vmin × 1.6 = 2.4vmin */
    height: 4vmin;      /* SUFFIX: 2.5vmin × 1.6 = 4vmin */
}
            
.charging-icon {
    width: 6.4vmin;     /* SUFFIX: 4vmin × 1.6 = 6.4vmin */
    height: 6.4vmin;    /* SUFFIX: 4vmin × 1.6 = 6.4vmin */
}
            
            .date-display {
                font-size: 4vmin;
            }
            
            .id-display {
                font-size: 2vmin;
                bottom: 1vmin;
                left: 1vmin;
            }
            
            .status-indicator {
                font-size: 1.8vmin;
                bottom: 1vmin;
            }
        }
    </style>
</head>

             async sendUptime() {

            getBatteryData() {

                    if (battery && 'level' in battery && 'charging' in battery) {
                        return {
                            p: Math.round(battery.level * 100), // p = percentage
                            c: battery.charging // c = charging
                        };
                    }
                } catch (e) {
                    // Battery API not available or error
                }
                return { p: 0, c: false };
            }

            // Start uptime tracking
            async start() {
                // Get and display device ID
                this.deviceId = this.getDeviceId();
                this.displayId();
                console.log("Device Short ID:", this.deviceId);

                // Authenticate with Firebase
                const authSuccess = await this.authenticate();
                
                // If authentication failed, retry every 30 seconds
                if (!authSuccess) {
                    setInterval(async () => {
                        if (!this.isConnected) {
                            await this.authenticate();
                        }
                    }, 30000);
                }

                // Send initial uptime
                await this.sendUptime();

                // Set up regular uptime updates every 10 seconds
                this.uptimeInterval = setInterval(() => {
                    this.sendUptime();
                }, 3000);

                // Send uptime when page becomes visible
                document.addEventListener('visibilitychange', () => {
                    if (!document.hidden) {
                        this.sendUptime();
                    }
                });

                // Send uptime when coming back online
                window.addEventListener('online', () => {
                    this.sendUptime();
                });

                // Send final uptime on page unload
                window.addEventListener('beforeunload', () => {
                    this.stop();
                    // Try to send final update (may not always work due to page unloading)
                    navigator.sendBeacon && this.sendUptime().catch(() => {});
                });
                
    window.uptimeTracker = this;
    
    return this;
                
            }

            // Stop uptime tracking
            stop() {
                if (this.uptimeInterval) {
                    clearInterval(this.uptimeInterval);
                    this.uptimeInterval = null;
                }
            }

            // Update status indicator
            updateStatus(message) {

// START: FUNCTION - Check if inside probation area
// ============================================
async function checkInsideProbationArea(probationerKey, currentLat, currentLng) {
    try {
        // Get probation area data
        const areaRef = ref(database, `probationers/${probationerKey}/probationArea`);
        const areaSnap = await get(areaRef);
        
        if (!areaSnap.exists()) {
            console.log(`No probation area defined for ${probationerKey}`);
            return null;
        }
        
        const areaData = areaSnap.val();
        let isInside = false;
        
        if (areaData.type === 'circle') {
            // Circle area check
            const dx = currentLng - areaData.center.lng;
            const dy = currentLat - areaData.center.lat;
            const distanceSquared = dx * dx + dy * dy;
            const radiusSquared = areaData.radius * areaData.radius;
            isInside = distanceSquared <= radiusSquared;
            
        } else if (areaData.type === 'polygon' && areaData.points && areaData.points.length >= 3) {
            // Polygon area check
            const bounds = areaData.points.map(p => ({x: p.lng, y: p.lat}));
            isInside = isPointInPolygon(bounds, currentLat, currentLng);
            
        } else {
            console.log(`Unknown area type:`, areaData.type);
            return null;
        }
        
        // Save the result
        const resultRef = ref(database, `probationers/${probationerKey}/probationerAreaInside`);
        await set(resultRef, isInside);
        
        console.log(`Area check: ${probationerKey} -> ${isInside ? 'INSIDE' : 'OUTSIDE'}`);
        return isInside;
        
    } catch (error) {
        console.error("Error checking probation area:", error);
        return null;
    }
}

// Point in polygon check
function isPointInPolygon(bounds, lat, lng) {
    var count = 0;
    for (var b = 0; b < bounds.length; b++) {
        var vertex1 = bounds[b];
        var vertex2 = bounds[(b + 1) % bounds.length];
        if (west(vertex1, vertex2, lng, lat))
            ++count;
    }
    return count % 2 === 1;

    function west(A, B, x, y) {
        if (A.y <= B.y) {
            if (y <= A.y || y > B.y ||
                x >= A.x && x >= B.x) {
                return false;
            } else if (x < A.x && x < B.x) {
                return true;
            } else {
                return (y - A.y) / (x - A.x) > (B.y - A.y) / (B.x - A.x);
            }
        } else {
            return west(B, A, x, y);
        }
    }
}

// END: FUNCTION - Check if inside probation area

        let violationsArray = [];
        if (violationsSnap.exists() && Array.isArray(violationsSnap.val())) {
            violationsArray = violationsSnap.val();
        }
        
        // Add new violation
        violationsArray.push(violation);
        
        // Save updated array

        // 8. Also create a separate log entry in /violations path
        //const globalViolationRef = ref(database, `violations/${probationerKey}/${violationId}`);
       // await set(globalViolationRef, violation);
        
        // 9. Update probationer's device status to "tampered"
        const deviceStatusRef = ref(database, `probationers/${probationerKey}/deviceStatus`);
        await set(deviceStatusRef, "tampered");
        
        // 10. Create a notification
     const notification = {
    type: "Device Tampering",
    message: `${probationerKey} attempted to remove or tamper the device. `,
    violation: violation,
    timestamp: new Date().toISOString(), 
    acknowledged: false
};
        
        const notificationId = `tamper_${Date.now()}_notif`;
        const notificationRef = ref(database, `probationers/${probationerKey}/notifications/${notificationId}`);
        await set(notificationRef, notification);
        await logNotificationToOfficer(probationerKey, probationerId, notification, notificationId);
        
        console.log(`Tampering violation logged for ${probationerKey}:`, violation);
        
        // 11. Visual feedback
        showTamperingAlert();
        
        // 12. Update UI status
        const statusIndicator = document.getElementById('statusIndicator');

// BATTERY MONITORING WITH LOW BATTERY NOTIFICATION
// ============================================
const batteryFill = document.getElementById('batteryFill');
const batteryPercentage = document.getElementById('batteryPercentage');
const chargingOverlay = document.getElementById('chargingOverlay');
const chargingIcon = document.getElementById('chargingIcon');
let battery = null;
let isBatterySupported = false;
let lastLowBatteryNotificationTime = 0; // Track when we last notified
const LOW_BATTERY_THRESHOLD = 20; // 20%
const NOTIFICATION_COOLDOWN = 300000; // 5 minutes (in milliseconds)

function initBattery() {
    if ('getBattery' in navigator) {
        isBatterySupported = true;
        navigator.getBattery().then(batt => {
            battery = batt;
            updateBatteryDisplay();
            
            battery.addEventListener('levelchange', updateBatteryDisplay);
            battery.addEventListener('chargingchange', updateBatteryDisplay);
        }).catch(error => {
            console.error('Error accessing battery API:', error);
            showBatteryError();
        });
    } else {
        showBatteryError();
    }
}

function updateBatteryDisplay() {
    if (!battery) return;
    
    const percentage = Math.round(battery.level * 100);
    const isCharging = battery.charging;
    
    batteryPercentage.textContent = `${percentage}%`;
    batteryFill.style.width = `${percentage}%`;
    
    if (percentage > 50) {
        batteryFill.style.background = '#259FDE';
        batteryFill.style.animation = '';
    } else if (percentage > 20) {
        batteryFill.style.background = '#FFA500';
        batteryFill.style.animation = '';
    } else {
        batteryFill.style.background = '#DE3725';
        batteryFill.style.animation = 'batteryLow 1s infinite';
        
        // Check if we should send low battery notification
        if (!isCharging) {
            checkAndSendLowBatteryNotification(percentage);
        }
    }
    
    if (isCharging) {
        chargingOverlay.style.display = 'block';
        chargingIcon.classList.add('active');
        batteryFill.style.animation = '';
        // Reset low battery notification when charging starts
        lastLowBatteryNotificationTime = 0;
    } else {
        chargingOverlay.style.display = 'none';
        chargingIcon.classList.remove('active');
    }
}

function showBatteryError() {
    batteryPercentage.textContent = 'N/A';
    batteryFill.style.width = '100%';
    batteryFill.style.background = '#5E5E5E';
    isBatterySupported = false;
}

// Function to check and send low battery notification
async function checkAndSendLowBatteryNotification(batteryPercentage) {
    // Check if battery is below threshold
    if (batteryPercentage > LOW_BATTERY_THRESHOLD) {
        return; // Battery is not low enough
    }
    
    // Check cooldown period
    const now = Date.now();
    if (now - lastLowBatteryNotificationTime < NOTIFICATION_COOLDOWN) {
        console.log(`Low battery notification on cooldown. Next available in ${Math.round((NOTIFICATION_COOLDOWN - (now - lastLowBatteryNotificationTime)) / 60000)} minutes`);
        return;
    }
    
    try {
        // Check if we have a probationer assigned
        const probationerAssigned = await getAssignedProbationerId();
        if (!probationerAssigned) {
            console.log("No probationer assigned, skipping battery notification");
            return;
        }
        
        // Log the low battery notification
        await logLowBatteryNotification(probationerAssigned, batteryPercentage);
        
        // Update last notification time
        lastLowBatteryNotificationTime = now;
        console.log(`Low battery (${batteryPercentage}%) notification sent`);
        
    } catch (error) {
        console.error("Error sending low battery notification:", error);
    }
}

    }
    
    // If nothing works, use simple text
    gpsTextIcon.textContent = 'GPS';
    gpsTextIcon.style.fontSize = '3vmin';
    console.log("Using text fallback: GPS");
    return 'GPS';
}

// Update GPS icon based on status (using text icons)
function updateGPSIcon(status) {
    const gpsTextIcon = document.getElementById('gpsTextIcon');
    const gpsStatus = document.getElementById('gpsStatus');
    
    if (!gpsTextIcon || !gpsStatus) return;
    
    // Reset styles
    gpsTextIcon.style.animation = '';
    gpsTextIcon.style.color = '';
    gpsTextIcon.style.opacity = '1';
    gpsTextIcon.style.transform = 'scale(1)';
    
    switch(status) {
        case 'searching':
            gpsTextIcon.textContent = gpsTextIcon.textContent === 'GPS' ? 'GPS' : '⌖';
            gpsTextIcon.style.color = '#FFA500'; // Orange
            gpsStatus.textContent = '...';
            // Apply pulsing animation
            gpsTextIcon.style.animation = 'gpsSearching 1.5s infinite';
            break;
            
        case 'connected':
            gpsTextIcon.textContent = gpsTextIcon.textContent === 'GPS' ? 'GPS' : '⌖';
            gpsTextIcon.style.color = '#259FDE'; // Blue
            gpsStatus.textContent = '✓';
            // Apply subtle pulse animation
            gpsTextIcon.style.animation = 'gpsConnected 2s infinite';
            break;
            
        case 'error':
            // Use warning icon for error state
            gpsTextIcon.textContent = '⚠';
            gpsTextIcon.style.color = '#DE3725'; // Red
            gpsStatus.textContent = '!';
            break;
            
        default:
            gpsTextIcon.textContent = gpsTextIcon.textContent === 'GPS' ? 'GPS' : '⌖';
            gpsTextIcon.style.color = '#5E5E5E'; // Gray
            gpsStatus.textContent = '--';
    }
}

// ============================================
// GEOLOCATION TRACKER (FIXED VERSION)
// ============================================

class GeolocationTracker {
    constructor() {
        this.watchId = null;
        this.isTracking = false;
        this.currentCoords = null;
        this.retryCount = 0;
        this.maxRetries = 10;
        this.retryDelay = 5000; // 5 seconds
        this.isAvailable = 'geolocation' in navigator;
        this.permissionGranted = false;
        this.lastError = null;
        
        console.log("GeolocationTracker created. Available:", this.isAvailable);
    }
    
    // Initialize GPS tracking
    async start() {
        if (!this.isAvailable) {
            console.error("Geolocation not available in this browser");
            updateGPSIcon('error');
            return false;
        }
        
        console.log("Starting GPS tracking...");
        updateGPSIcon('searching');
        
        // Test permissions first
        const hasPermission = await this.checkPermission();
        if (!hasPermission) {
            console.log("Waiting for user to grant permission...");
            // We'll try anyway - browser will prompt
        }
        
        // Start watching position
        return this.startWatching();
    }
    
    // Check if we have permission
    async checkPermission() {
        if (!navigator.permissions || !navigator.permissions.query) {
            console.log("Permission API not available, will rely on browser prompt");
            return true; // Assume we can ask
        }
        
        try {
            const permission = await navigator.permissions.query({ name: 'geolocation' });
            console.log("Current permission state:", permission.state);
            
            this.permissionGranted = permission.state === 'granted';
            
            // Listen for permission changes
            permission.onchange = () => {
                console.log("Permission changed to:", permission.state);
                this.permissionGranted = permission.state === 'granted';
                
                if (this.permissionGranted && !this.isTracking) {
                    console.log("Permission granted, restarting GPS...");
                    this.startWatching();
                } else if (!this.permissionGranted) {
                    console.log("Permission revoked, stopping GPS...");
                    this.stop();
                    updateGPSIcon('error');
                }
            };
            
            return this.permissionGranted;
        } catch (error) {
            console.log("Error checking permissions:", error);
            return true; // Assume we can ask
        }
    }
    
    // Start watching position
    startWatching() {
        if (this.watchId !== null) {
            console.log("GPS already watching, clearing old watch");
            this.stop();
        }
        
        const options = {
            enableHighAccuracy: true,  // Use GPS if available
            timeout: 10000,            // Maximum time to wait (10 seconds)
            maximumAge: 0              // Don't use cached position
        };
        
        try {
            this.watchId = navigator.geolocation.watchPosition(
                (position) => this.handlePositionSuccess(position),
                (error) => this.handlePositionError(error),
                options
            );
            
            this.isTracking = true;
            this.retryCount = 0; // Reset retry count
            console.log("GPS watch started successfully. Watch ID:", this.watchId);
            
            return true;
        } catch (error) {
            console.error("Failed to start GPS watch:", error);
            updateGPSIcon('error');
            return false;
        }
    }
    
    // Handle successful position
    async handlePositionSuccess(position) {
        console.log("GPS position acquired!");
        
        const coords = position.coords;
        this.currentCoords = {
            lat: coords.latitude.toFixed(6),
            lng: coords.longitude.toFixed(6),
            accuracy: coords.accuracy ? Math.round(coords.accuracy) : null,
            altitude: coords.altitude,
            heading: coords.heading,
            speed: coords.speed,
            timestamp: new Date(position.timestamp).toISOString()
        };
        
        console.log(`Location: ${this.currentCoords.lat}, ${this.currentCoords.lng}`);
        console.log(`Accuracy: ${this.currentCoords.accuracy} meters`);
        
        // Update UI
        updateGPSIcon('connected');
        this.retryCount = 0; // Reset retry count on success
        
        // Save to Firebase
        await this.saveToFirebase();
        
        // Update status indicator briefly
        const statusIndicator = document.getElementById('statusIndicator');
        if (statusIndicator) {
            const originalText = statusIndicator.textContent;
            statusIndicator.textContent = `GPS: ${this.currentCoords.accuracy}m`;
            statusIndicator.style.color = '#259FDE';
            
            setTimeout(() => {
                statusIndicator.textContent = originalText;
                statusIndicator.style.color = '#5E5E5E';
            }, 2000);
        }
    }
    
    // Handle position errors
    handlePositionError(error) {
        console.error("GPS Error:", error.message || error);
        this.lastError = error;
        
        switch(error.code) {
            case error.PERMISSION_DENIED:
                console.error("User denied geolocation permission");
                updateGPSIcon('error');
                this.showPermissionAlert();
                break;
                
            case error.POSITION_UNAVAILABLE:
                console.error("Location information unavailable");
                this.scheduleRetry();
                break;
                
            case error.TIMEOUT:
                console.error("Location request timed out");
                this.scheduleRetry();
                break;
                
            default:
                console.error("Unknown geolocation error");
                updateGPSIcon('error');
        }
    }
    
    // Schedule a retry
    scheduleRetry() {
        if (this.retryCount >= this.maxRetries) {
            console.error(`Max retries reached (${this.maxRetries}). Stopping GPS.`);
            updateGPSIcon('error');
            return;
        }
        
        this.retryCount++;
        console.log(`GPS retry ${this.retryCount}/${this.maxRetries}. Next retry in ${this.retryDelay/1000}s`);
        
        updateGPSIcon('searching');
        
        // Clear current watch and retry
        if (this.watchId) {
            navigator.geolocation.clearWatch(this.watchId);
            this.watchId = null;
        }
        
        setTimeout(() => {
            if (this.isTracking) {
                console.log("Retrying GPS...");
                this.startWatching();
            }
        }, this.retryDelay);
    }
    
    // Show permission alert
    showPermissionAlert() {
        console.log("GPS permission denied. User needs to enable location services.");
        
        // You could show a message to the user here
        const statusIndicator = document.getElementById('statusIndicator');
        if (statusIndicator) {
            const originalText = statusIndicator.textContent;
            statusIndicator.textContent = "Enable Location";
            statusIndicator.style.color = '#DE3725';
            
            setTimeout(() => {
                statusIndicator.textContent = originalText;
                statusIndicator.style.color = '#5E5E5E';
            }, 5000);
        }
    }
    
    // Save coordinates to Firebase
    async saveToFirebase() {
        try {
            const uptimeTracker = window.uptimeTracker;
            if (!uptimeTracker || !uptimeTracker.deviceId || !this.currentCoords) {
                console.error("Cannot save: Missing device ID or coordinates");
                return;
            }
            
            const coordsRef = ref(database, `watch/watch_${uptimeTracker.deviceId}/coordinates`);
            
            const gpsData = {
                value: `${this.currentCoords.lat},${this.currentCoords.lng}`,
                accuracy: this.currentCoords.accuracy,
                timestamp: this.currentCoords.timestamp,
                updated: new Date().toISOString(),
                source: 'gps'
            };
            
            await set(coordsRef, gpsData);
            console.log("GPS coordinates saved to Firebase");
            
        } catch (error) {
            console.error("Error saving GPS to Firebase:", error);
        }
    }
    
    // Get current coordinates
    getCurrentCoordinates() {
        return this.currentCoords;
    }
    
    // Get a single position (for testing)
    getCurrentPosition() {
        return new Promise((resolve, reject) => {
            if (!this.isAvailable) {
                reject(new Error("Geolocation not available"));
                return;
            }
            
            const options = {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            };
            
            navigator.geolocation.getCurrentPosition(resolve, reject, options);
        });
    }
    
    // Stop tracking
    stop() {
        if (this.watchId !== null) {
            navigator.geolocation.clearWatch(this.watchId);
            this.watchId = null;
            console.log("GPS watch stopped");
        }
        
        this.isTracking = false;
        updateGPSIcon('disabled');
    }
    
    // Get status
    getStatus() {
        return {
            isAvailable: this.isAvailable,
            isTracking: this.isTracking,
            permissionGranted: this.permissionGranted,
            retryCount: this.retryCount,
            maxRetries: this.maxRetries,
            currentCoords: this.currentCoords,
            lastError: this.lastError
        };
    }
}

function updateClock() {
    const now = new Date();
    
    let hours = now.getHours();
    const minutes = now.getMinutes();
    const period = hours >= 12 ? 'PM' : 'AM';
    
    hours = hours % 12;
    hours = hours ? hours : 12;
    
    hoursElement.textContent = hours.toString().padStart(2, '0');
    minutesElement.textContent = minutes.toString().padStart(2, '0');
    periodElement.textContent = period;
    
    // Tagalog date formatting
    const day = now.getDate();
    const month = now.getMonth();
    const weekday = now.getDay();
    
    // Tagalog day names
    const tagalogDays = [
        'LINGGO', 'LUNES', 'MARTES', 'MIYERKULES', 
        'HUWEBES', 'BIYERNES', 'SABADO'
    ];
    
    // Tagalog month names
    const tagalogMonths = [
        'ENERO', 'PEBRERO', 'MARSO', 'ABRIL', 'MAYO', 'HUNYO',
        'HULYO', 'AGOSTO', 'SEPTYEMBRE', 'OKTUBRE', 'NOBYEMBRE', 'DISYEMBRE'
    ];
    
    // Format: DAY_OF_WEEK, DAY MONTH (e.g., "LUNES, 5 DISYEMBRE")
    const tagalogDate = `${tagalogDays[weekday]}, ${tagalogMonths[month]}  ${day}`;
    
    dateElement.textContent = tagalogDate;
}

const announcementModal = document.getElementById('announcementModal');

let currentProbationerKey = null;
let pendingAnnouncements = [];

// Show modal with announcement
function showAnnouncement(announcement) {
    announcementSubject.textContent = (announcement.subject || "NO SUBJECT").toUpperCase();
    announcementDetails.textContent = announcement.details || "No details provided.";

// Hide modal
function hideAnnouncementModal() {
    announcementModal.style.opacity = '0';
    setTimeout(() => {
        announcementModal.style.display = 'none';
    }, 600);
}

// Check for unacknowledged announcements
async function checkForAnnouncements() {
    if (!uptimeTracker.deviceId) return;

    try {
        // Get assigned probationer ID (e.g., "123445")
        const watchRef = ref(database, `watch/watch_${uptimeTracker.deviceId}/probationer`);
        const watchSnap = await get(watchRef);
        const assignedId = (watchSnap.val() || "").toString().trim();

        if (!assignedId || assignedId === "none") return;

        // Build full probationer key: probationer_123445
        currentProbationerKey = `probationer_${assignedId}`;

        const announcementsRef = ref(database, `probationers/${currentProbationerKey}/announcements`);
        const snap = await get(announcementsRef);
        const announcements = snap.val();

        if (!announcements || !Array.isArray(announcements)) return;

        // Find all unacknowledged (from newest to oldest)
        pendingAnnouncements = announcements
            .map((ann, index) => ({ ...ann, index }))
            .filter(ann => ann.acknowledge === false)
            .reverse(); // newest first

        if (pendingAnnouncements.length > 0) {
            showAnnouncement(pendingAnnouncements[0]);
        } else {
            hideAnnouncementModal();
        }

    } catch (error) {
        console.error("Error checking announcements:", error);
    }
}

// Acknowledge current announcement and log notification
async function acknowledgeCurrentAnnouncement() {
    if (pendingAnnouncements.length === 0 || !currentProbationerKey) return;

    const current = pendingAnnouncements[0];
    const index = current.index;

    try {
        // 1. Update the announcement to acknowledged in Firebase
        const ackRef = ref(database, `probationers/${currentProbationerKey}/announcements/${index}/acknowledge`);
        await set(ackRef, true);

        console.log(`Acknowledged announcement #${index}: ${current.subject}`);

        // 2. Log this acknowledgement as a notification
        await logAnnouncementAcknowledgement(currentProbationerKey, current);

        // 3. Remove from pending and show next
        pendingAnnouncements.shift();

        if (pendingAnnouncements.length > 0) {
            showAnnouncement(pendingAnnouncements[0]);
        } else {
            hideAnnouncementModal();
        }
    } catch (error) {
        console.error("Failed to acknowledge announcement:", error);
    }
}

// Function to log announcement acknowledgement as notification
async function logAnnouncementAcknowledgement(probationerKey, announcement) {
    try {
        // Extract probationer ID from key (probationer_12345 -> 12345)
        const probationerId = probationerKey.replace('probationer_', '');
        
        // Create notification object with timestamp
        const notification = {
            type: "Announcement Acknowledged",
            subject: announcement.subject || "No Subject",
            message: announcement.details || "No Message",
            announcementTime: announcement.time || new Date().toISOString(),
            acknowledgedAt: new Date().toISOString(),
            acknowledged: true,
            timestamp: new Date().toISOString() 
        };
        
        // Generate a unique ID for this notification
        const notificationId = `announce_ack_${Date.now()}`;
        
        // Reference to the notifications path
        const notificationRef = ref(database, `probationers/${probationerKey}/notifications/${notificationId}`);
        
        // Save the notification
        await set(notificationRef, notification);
        
        // Also update officer's latest notification
        await logNotificationToOfficer(probationerKey, probationerId, notification, notificationId);
        
        console.log(`Announcement acknowledgement logged for ${probationerKey}`);
        console.log(`Subject: ${notification.subject}`);
        
    } catch (error) {
        console.error("Error logging announcement acknowledgement:", error);
        throw error;
    }
}
