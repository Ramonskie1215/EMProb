        * {

    <script type="module">
        // Import the functions you need from the SDKs you need
        import { initializeApp as initializeFirebase } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-database.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";

        // Your web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBGONaynbM6GSdq4Ee46dD8tqfeCYx-w-M",
            authDomain: "probationlocator.firebaseapp.com",
            databaseURL: "https://probationlocator-default-rtdb.firebaseio.com",
            projectId: "probationlocator",
            storageBucket: "probationlocator.firebasestorage.app",
            messagingSenderId: "323066331183",
            appId: "1:323066331183:web:61f35b70cb07c0618106da"
        };

        // Initialize Firebase
        const app = initializeFirebase(firebaseConfig);
        const database = getDatabase(app);
        const auth = getAuth(app);

        // Authentication check function
        function checkAuth() {
            const username = localStorage.getItem('emprobUsername');
            if (!username) {
                window.location.href = 'index.html';
            }
            return username;
        }

        // Get user data from Firebase
        async function getUserData(username) {
            try {
                const userRef = ref(database, 'credentials/' + username);
                const snapshot = await get(userRef);
                
                if (snapshot.exists()) {
                    return snapshot.val();
                } else {
                    console.error('User data not found in Firebase');
                    return null;
                }
            } catch (error) {
                console.error('Error fetching user data:', error);
                return null;
            }
        }

        // Update avatar with profile picture
        function updateAvatar(userData) {
            const userAvatar = document.getElementById('userAvatar');
            const avatarInitials = document.getElementById('avatarInitials');
            
            if (userData.profilePicture) {
                // Create img element for profile picture
                const img = document.createElement('img');
                img.src = userData.profilePicture;
                img.alt = userData.username + ' profile picture';
                img.className = 'user-avatar-img';
                
                // Clear the avatar div and add the image
                userAvatar.innerHTML = '';
                userAvatar.appendChild(img);
                
                // Hide initials if image loads successfully
                avatarInitials.style.display = 'none';
            } else {
                // If no profile picture, show initials
                avatarInitials.textContent = userData.username.charAt(0).toUpperCase();
                avatarInitials.style.display = 'flex';
            }
        }

        // Initialize the application
        async function initApplication() {
            const username = checkAuth();
            
            if (!username) {
                return;
            }

            try {
                // Authenticate anonymously with Firebase
                await signInAnonymously(auth);
                console.log("Anonymous authentication successful");

                // Get user data from Firebase
                const userData = await getUserData(username);
                
                if (userData) {
                    // Update UI with user data
                    document.getElementById('usernameDisplay').textContent = userData.username;
                    document.getElementById('emailDisplay').textContent = userData.email;
                    
                    // Update avatar with profile picture or initials
                    updateAvatar(userData);
                    
                    // Show the main interface
                    document.getElementById('loadingScreen').style.display = 'none';
                    document.getElementById('mainHeader').style.display = 'flex';
                    document.getElementById('mapContainer').style.display = 'block';
                    
                    // Initialize the map
                    initializeMap();
                } else {
                    // If user data not found, redirect to login
                    localStorage.removeItem('emprobUsername');
                    window.location.href = 'index.html';
                }
            } catch (error) {
                console.error("Initialization error:", error);
                document.getElementById('loadingScreen').innerHTML = `
                    <div style="text-align: center; color: #ff6b6b;">
                        <h3>Error Loading Application</h3>
                        <p>Please refresh the page or try again later.</p>
                    </div>
                `;
            }
        }

        // Call initialization when page loads
        document.addEventListener('DOMContentLoaded', initApplication);
    </script>

    zoomControl: false,  // This disables the default zoom control
    attributionControl: false  // Optional: also hides the attribution text
}).setView([currentLat, currentLng], 13);
            
            // Add tile layers
            const streetLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);
            
            const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
            });
            
            const terrainLayer = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
                attribution: 'Map data: &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, <a href="http://viewfinderpanoramas.org">SRTM</a> | Map style: &copy; <a href="https://opentopomap.org">OpenTopoMap</a>'
            });
            
            // Layer control
            const baseLayers = {
                "Streets": streetLayer,
                "Satellite": satelliteLayer,
                "Terrain": terrainLayer
            };
        
            
            // Create a custom circle icon for all locations
            function createCircleIcon(color = '#259FDE') {
                return L.divIcon({
                    html: `<div style="background: ${color}; width: 20px; height: 20px; border-radius: 50%; border: 3px solid white; box-shadow: 0 0 10px rgba(0,0,0,0.5);"></div>`,
                    iconSize: [26, 26],
                    className: 'circle-location-marker'
                });
            }
            
            // Add a marker for your current location
            let marker = L.marker([currentLat, currentLng], {icon: createCircleIcon()}).addTo(map)
                .bindPopup('<b>Your Current Location</b><br>Latitude: 14.7596° N<br>Longitude: 120.9633° E')
            
            // Get address for current location
            async function getAddress(lat, lng) {
                try {
                    const response = await fetch(
                        `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`
                    );
                    
                    if (!response.ok) {
                        throw new Error('Reverse geocoding failed');
                    }
                    
                    const data = await response.json();
                    return data.display_name || 'Address not available';
                } catch (error) {
                    console.error('Reverse geocoding error:', error);
                    return 'Address not available';
                }
            }
            
            // Update location info with address
            getAddress(currentLat, currentLng).then(address => {
                document.getElementById('locationAddress').textContent = address;
            });
            // Map Controls hide/show functionality
const mapControls = document.getElementById('mapControls');
const hideControlsBtn = document.getElementById('hideControlsBtn');
const showControlsBtn = document.getElementById('showControlsBtn');

// Location info hide/show functionality - ADD THIS CODE RIGHT HERE
const locationInfo = document.querySelector('.location-info');
const hideLocationBtn = document.getElementById('hideLocationBtn');
const showLocationBtn = document.getElementById('showLocationBtn');

// Hide location info by default if you want, or keep it visible
  locationInfo.style.display = 'none';
  showLocationBtn.style.display = 'block';

hideLocationBtn.addEventListener('click', function() {
    locationInfo.style.display = 'none';
    showLocationBtn.style.display = 'block';
});

showLocationBtn.addEventListener('click', function() {
    locationInfo.style.display = 'block';
    showLocationBtn.style.display = 'none';
});
            
            hideControlsBtn.addEventListener('click', function() {
                mapControls.classList.add('hidden');
                showControlsBtn.style.display = 'block';
            });
            
            showControlsBtn.addEventListener('click', function() {
                mapControls.classList.remove('hidden');
                showControlsBtn.style.display = 'none';
            });
            
            // Profile dropdown functionality
            const userProfile = document.getElementById('userProfile');
            const profileDropdown = document.getElementById('profileDropdown');
            
            userProfile.addEventListener('click', function(e) {
                e.stopPropagation();
                profileDropdown.classList.toggle('active');
            });
            
            // Close dropdown when clicking outside
            document.addEventListener('click', function() {
                profileDropdown.classList.remove('active');
            });
            
            // Search functionality
            const searchInput = document.getElementById('searchInput');
            const searchResults = document.getElementById('searchResults');
            const searchSpinner = document.getElementById('searchSpinner');
            let searchTimeout;
            
            // Search when typing with debounce
            searchInput.addEventListener('input', function() {
                clearTimeout(searchTimeout);
                const query = this.value.trim();
                
                if (query.length < 3) {
                    searchResults.style.display = 'none';
                    return;
                }
                
                searchTimeout = setTimeout(() => {
                    searchLocation(query);
                }, 500);
            });
            
            // Search when button is clicked
            document.getElementById('searchBtn').addEventListener('click', function() {
                const query = searchInput.value.trim();
                if (query) {
                    searchLocation(query);
                }
            });
            
            // Return to current location
            document.getElementById('currentLocationBtn').addEventListener('click', function() {
                map.setView([currentLat, currentLng], 13);
                marker.setLatLng([currentLat, currentLng])
                    .bindPopup('<b>Your Current Location</b><br>Latitude: 14.7596° N<br>Longitude: 120.9633° E')
                    .openPopup();
            });
            
            // Search for location using Nominatim API
            async function searchLocation(query) {
                searchSpinner.style.display = 'block';
                searchResults.style.display = 'none';
                
                try {
                    const response = await fetch(
                        `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=5`
                    );
                    
                    if (!response.ok) {
                        throw new Error('Search failed');
                    }
                    
                    const results = await response.json();
                    displaySearchResults(results);
                } catch (error) {
                    console.error('Search error:', error);
                    searchResults.innerHTML = '<div class="search-result-item">Error searching for location</div>';
                    searchResults.style.display = 'block';
                } finally {
                    searchSpinner.style.display = 'none';
                }
            }
            
            // Display search results
            function displaySearchResults(results) {
                searchResults.innerHTML = '';
                
                if (results.length === 0) {
                    searchResults.innerHTML = '<div class="search-result-item">No results found</div>';
                    searchResults.style.display = 'block';
                    return;
                }
                
                results.forEach(result => {
                    const item = document.createElement('div');
                    item.className = 'search-result-item';
                    
                    const name = document.createElement('div');
                    name.className = 'search-result-name';
                    name.textContent = result.display_name.split(',')[0];
                    
                    const details = document.createElement('div');
                    details.className = 'search-result-details';
                    details.textContent = result.display_name;
                    
                    item.appendChild(name);
                    item.appendChild(details);
                    
                    item.addEventListener('click', () => {
                        selectLocation(result);
                    });
                    
                    searchResults.appendChild(item);
                });
                
                searchResults.style.display = 'block';
            }
            
            // Select a location from search results
            function selectLocation(location) {
                const lat = parseFloat(location.lat);
                const lon = parseFloat(location.lon);
                
                // Update map view
                map.setView([lat, lon], 13);
                
                // Update or create marker - always use circle icon
                if (marker) {
                    map.removeLayer(marker);
                }
                
                // Use a slightly different color for searched locations
                const searchedLocationColor = '#0E3CBD';
                
                marker = L.marker([lat, lon], {icon: createCircleIcon(searchedLocationColor)}).addTo(map)
                    .bindPopup(`<b>${location.display_name.split(',')[0]}</b><br>${location.display_name}`)
                    .openPopup();
                
                // Clear search results
                searchResults.style.display = 'none';
                searchInput.value = location.display_name;
                
                // Update location info
                document.getElementById('locationDetails').innerHTML = `
                    Latitude: ${lat.toFixed(4)}° ${lat >= 0 ? 'N' : 'S'}<br>
                    Longitude: ${lon.toFixed(4)}° ${lon >= 0 ? 'E' : 'W'}<br>
                    <span id="locationAddress">${location.display_name}</span>
                `;
            }
            
            // Layer selection
            document.getElementById('layerSelect').addEventListener('change', function() {
                const selectedLayer = this.value;
                
                // Remove all layers
                map.removeLayer(streetLayer);
                map.removeLayer(satelliteLayer);
                map.removeLayer(terrainLayer);
                
                // Add the selected layer
                if (selectedLayer === 'streets') {
                    streetLayer.addTo(map);
                } else if (selectedLayer === 'satellite') {
                    satelliteLayer.addTo(map);
                } else if (selectedLayer === 'terrain') {
                    terrainLayer.addTo(map);
                }
            });

            document.getElementById('zoomInBtn').addEventListener('click', function() {
    map.zoomIn();
});

document.getElementById('zoomOutBtn').addEventListener('click', function() {
    map.zoomOut();
});
            
            // Logout functionality
            document.getElementById('logoutBtn').addEventListener('click', function() {
                if (confirm('Are you sure you want to logout?')) {
                    localStorage.removeItem('emprobUsername');
                    window.location.href = 'index.html';
                }
            });
            
            // Close search results when clicking outside
            document.addEventListener('click', function(event) {
                if (!event.target.closest('.control-group')) {
                    searchResults.style.display = 'none';
                }
            });
        }
    </script>
</body>
</html>
