<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto-Retry Location Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            max-width: 500px;
            width: 100%;
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 5px;
            font-size: 24px;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
            font-size: 14px;
        }
        
        .status {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            text-align: center;
            border: 2px solid #e9ecef;
            font-weight: 500;
            min-height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .status-getting {
            background: #fff3cd;
            border-color: #ffeaa7;
            color: #856404;
        }
        
        .status-active {
            background: #d4edda;
            border-color: #c3e6cb;
            color: #155724;
        }
        
        .status-error {
            background: #f8d7da;
            border-color: #f5c6cb;
            color: #721c24;
        }
        
        .status-retry {
            background: #cce5ff;
            border-color: #b8daff;
            color: #004085;
        }
        
        .location-box {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        
        .coordinate {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid #dee2e6;
        }
        
        .coordinate:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }
        
        .label {
            font-weight: 600;
            color: #495057;
            font-size: 14px;
        }
        
        .value {
            color: #007bff;
            font-weight: 500;
            font-size: 14px;
        }
        
        .buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .start-btn {
            background: #28a745;
            color: white;
        }
        
        .start-btn:hover {
            background: #218838;
        }
        
        .stop-btn {
            background: #dc3545;
            color: white;
        }
        
        .stop-btn:hover {
            background: #c82333;
        }
        
        .stop-btn:disabled {
            background: #6c757d;
            cursor: not-allowed;
        }
        
        .debug {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
        }
        
        .debug h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .log {
            height: 120px;
            overflow-y: auto;
            padding: 10px;
            background: white;
            border-radius: 5px;
            border: 1px solid #dee2e6;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }
        
        .log-entry {
            padding: 4px 0;
            border-bottom: 1px solid #f1f3f5;
        }
        
        .log-time {
            color: #6c757d;
        }
        
        .log-message {
            color: #333;
        }
        
        .loading {
            color: #6c757d;
            font-style: italic;
        }
        
        .retry-count {
            color: #007bff;
            font-weight: bold;
        }
        
        .pulse {
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📍 Location Tracker</h1>
        <p class="subtitle">Auto-retry if location takes time</p>
        
        <div id="status" class="status">
            Ready to start tracking
        </div>
        
        <div class="buttons">
            <button id="startBtn" class="start-btn">Start Tracking</button>
            <button id="stopBtn" class="stop-btn" disabled>Stop</button>
        </div>
        
        <div class="location-box">
            <div class="coordinate">
                <span class="label">Latitude:</span>
                <span id="latitude" class="value loading">--</span>
            </div>
            <div class="coordinate">
                <span class="label">Longitude:</span>
                <span id="longitude" class="value loading">--</span>
            </div>
            <div class="coordinate">
                <span class="label">Accuracy:</span>
                <span id="accuracy" class="value loading">--</span>
            </div>
            <div class="coordinate">
                <span class="label">Retry Count:</span>
                <span id="retryCount" class="value">0</span>
            </div>
            <div class="coordinate">
                <span class="label">Last Update:</span>
                <span id="timestamp" class="value loading">--</span>
            </div>
        </div>
        
        <div class="debug">
            <h3>📝 Activity Log</h3>
            <div id="log" class="log">
                <div class="log-entry">
                    <span class="log-time">[System]</span>
                    <span class="log-message">Tracker ready</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // State management
        let isTracking = false;
        let watchId = null;
        let updateCount = 0;
        let retryCount = 0;
        let maxRetries = 5;
        let retryDelay = 2000; // 2 seconds between retries
        let currentRetryTimer = null;
        
        // DOM elements
        const statusEl = document.getElementById('status');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const latitudeEl = document.getElementById('latitude');
        const longitudeEl = document.getElementById('longitude');
        const accuracyEl = document.getElementById('accuracy');
        const timestampEl = document.getElementById('timestamp');
        const retryCountEl = document.getElementById('retryCount');
        const logEl = document.getElementById('log');
        
        // Check if geolocation is supported
        function checkSupport() {
            if (!navigator.geolocation) {
                statusEl.textContent = "❌ Geolocation not supported";
                statusEl.className = "status status-error";
                startBtn.disabled = true;
                addLog("Error: Geolocation not supported by browser", "error");
                return false;
            }
            return true;
        }
        
        // Add message to log
        function addLog(message, type = "info") {
            const now = new Date();
            const time = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});
            
            const logEntry = document.createElement('div');
            logEntry.className = 'log-entry';
            
            let color = "#333";
            if (type === "error") color = "#dc3545";
            if (type === "success") color = "#28a745";
            if (type === "retry") color = "#007bff";
            
            logEntry.innerHTML = `
                <span class="log-time">[${time}]</span>
                <span class="log-message" style="color: ${color}">${message}</span>
            `;
            
            logEl.appendChild(logEntry);
            
            // Keep only last 8 logs
            while (logEl.children.length > 8) {
                logEl.removeChild(logEl.firstChild);
            }
            
            // Auto-scroll
            logEl.scrollTop = logEl.scrollHeight;
        }
        
        // Update display with position data
        function updateDisplay(position) {
            // Reset retry count on success
            retryCount = 0;
            retryCountEl.textContent = retryCount;
            retryCountEl.style.color = "#007bff";
            
            // Update coordinates
            latitudeEl.textContent = position.coords.latitude.toFixed(6);
            longitudeEl.textContent = position.coords.longitude.toFixed(6);
            accuracyEl.textContent = `${Math.round(position.coords.accuracy)} meters`;
            
            // Update timestamp
            const now = new Date();
            timestampEl.textContent = now.toLocaleTimeString();
            
            updateCount++;
            
            // Clear loading styles
            [latitudeEl, longitudeEl, accuracyEl, timestampEl].forEach(el => {
                el.classList.remove("loading");
            });
            
            return now;
        }
        
        // Show loading state
        function showLoading() {
            statusEl.textContent = "⌛ Getting location...";
            statusEl.className = "status status-getting pulse";
            addLog("Attempting to get location...", "info");
        }
        
        // Clear any pending retry timer
        function clearRetryTimer() {
            if (currentRetryTimer) {
                clearTimeout(currentRetryTimer);
                currentRetryTimer = null;
            }
        }
        
        // Attempt to get location with retry logic
        function attemptLocationWithRetry() {
            if (!isTracking) return;
            
            clearRetryTimer();
            showLoading();
            
            // Clear previous loading states
            [latitudeEl, longitudeEl, accuracyEl, timestampEl].forEach(el => {
                el.classList.add("loading");
                if (el.id !== 'timestamp') el.textContent = "--";
            });
            
            // Get current position with timeout
            navigator.geolocation.getCurrentPosition(
                // Success callback
                (position) => {
                    const time = updateDisplay(position);
                    statusEl.textContent = "📍 Tracking active";
                    statusEl.className = "status status-active";
                    addLog(`Location found: ${position.coords.latitude.toFixed(4)}, ${position.coords.longitude.toFixed(4)}`, "success");
                    
                    // Start continuous tracking after initial success
                    startContinuousTracking();
                },
                // Error callback
                (error) => {
                    handleLocationError(error);
                },
                // Options
                {
                    enableHighAccuracy: true,
                    timeout: 10000,  // 10 second timeout
                    maximumAge: 0
                }
            );
        }
        
        // Handle location errors with auto-retry
        function handleLocationError(error) {
            let errorMsg = "";
            
            switch(error.code) {
                case 1: // PERMISSION_DENIED
                    errorMsg = "Permission denied. Please enable location access.";
                    statusEl.textContent = "❌ " + errorMsg;
                    statusEl.className = "status status-error";
                    addLog("Error: Location permission denied", "error");
                    stopTracking();
                    return;
                    
                case 2: // POSITION_UNAVAILABLE
                    errorMsg = "Location unavailable. Retrying...";
                    break;
                    
                case 3: // TIMEOUT
                    errorMsg = "Location request timed out. Retrying...";
                    break;
                    
                default:
                    errorMsg = "Unknown error. Retrying...";
            }
            
            retryCount++;
            retryCountEl.textContent = retryCount;
            
            // Change color based on retry count
            if (retryCount >= 3) {
                retryCountEl.style.color = "#ffc107"; // Yellow warning
            }
            if (retryCount >= maxRetries) {
                retryCountEl.style.color = "#dc3545"; // Red error
            }
            
            // Check if we should stop retrying
            if (retryCount >= maxRetries) {
                statusEl.textContent = "❌ Failed after " + maxRetries + " retries";
                statusEl.className = "status status-error";
                addLog(`Failed after ${maxRetries} retries. Please check location services.`, "error");
                return;
            }
            
            // Show retry status
            statusEl.textContent = `🔄 ${errorMsg} (${retryCount}/${maxRetries})`;
            statusEl.className = "status status-retry";
            addLog(`${errorMsg} Attempt ${retryCount}/${maxRetries}`, "retry");
            
            // Schedule retry
            currentRetryTimer = setTimeout(() => {
                if (isTracking) {
                    attemptLocationWithRetry();
                }
            }, retryDelay);
        }
        
        // Start continuous tracking after initial location is found
        function startContinuousTracking() {
            if (!isTracking || watchId) return;
            
            watchId = navigator.geolocation.watchPosition(
                (position) => {
                    const time = updateDisplay(position);
                    // Log occasional updates (every 5th)
                    if (updateCount % 5 === 0) {
                        addLog(`Update: ${position.coords.latitude.toFixed(4)}, ${position.coords.longitude.toFixed(4)}`);
                    }
                },
                (error) => {
                    // If continuous tracking fails, try to get single position again
                    addLog("Continuous tracking interrupted, retrying...", "retry");
                    attemptLocationWithRetry();
                },
                {
                    enableHighAccuracy: true,
                    maximumAge: 3000, // Accept positions up to 3 seconds old
                    timeout: 15000
                }
            );
            
            addLog("Continuous tracking started", "success");
        }
        
        // Start tracking
        function startTracking() {
            if (!checkSupport() || isTracking) return;
            
            isTracking = true;
            startBtn.disabled = true;
            stopBtn.disabled = false;
            updateCount = 0;
            retryCount = 0;
            retryCountEl.textContent = "0";
            retryCountEl.style.color = "#007bff";
            
            addLog("Starting location tracking with auto-retry...", "info");
            attemptLocationWithRetry();
        }
        
        // Stop tracking
        function stopTracking() {
            clearRetryTimer();
            
            if (watchId) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }
            
            isTracking = false;
            startBtn.disabled = false;
            stopBtn.disabled = true;
            
            statusEl.textContent = "Tracking stopped";
            statusEl.className = "status";
            addLog("Tracking stopped", "info");
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            checkSupport();
            
            // Event listeners
            startBtn.addEventListener('click', startTracking);
            stopBtn.addEventListener('click', stopTracking);
            
            // Handle page visibility changes
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    addLog("Page hidden", "info");
                } else if (isTracking) {
                    addLog("Page visible again", "info");
                }
            });
        });
    </script>
</body>
</html>
