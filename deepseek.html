<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Location Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        
        .status {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            border: 2px solid #e9ecef;
        }
        
        .status-active {
            background: #d4edda;
            border-color: #c3e6cb;
            color: #155724;
        }
        
        .status-error {
            background: #f8d7da;
            border-color: #f5c6cb;
            color: #721c24;
        }
        
        .location-box {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        .coordinate {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #dee2e6;
        }
        
        .coordinate:last-child {
            margin-bottom: 0;
            border-bottom: none;
        }
        
        .label {
            font-weight: 600;
            color: #495057;
        }
        
        .value {
            color: #007bff;
            font-weight: 500;
        }
        
        .buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        button {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .start-btn {
            background: #28a745;
            color: white;
        }
        
        .start-btn:hover {
            background: #218838;
        }
        
        .stop-btn {
            background: #dc3545;
            color: white;
        }
        
        .stop-btn:hover {
            background: #c82333;
        }
        
        .stop-btn:disabled {
            background: #6c757d;
            cursor: not-allowed;
        }
        
        .debug {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }
        
        .debug h3 {
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .log {
            max-height: 200px;
            overflow-y: auto;
            padding: 10px;
            background: white;
            border-radius: 5px;
            border: 1px solid #dee2e6;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }
        
        .log-entry {
            padding: 5px 0;
            border-bottom: 1px solid #f1f3f5;
        }
        
        .log-time {
            color: #6c757d;
            font-size: 12px;
        }
        
        .log-message {
            color: #333;
        }
        
        .stats {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #dee2e6;
        }
        
        .stat-item {
            flex: 1;
            text-align: center;
            padding: 10px;
            background: white;
            border-radius: 8px;
            border: 1px solid #dee2e6;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: 600;
            color: #007bff;
        }
        
        .stat-label {
            font-size: 12px;
            color: #6c757d;
            margin-top: 5px;
        }
        
        .loading {
            color: #6c757d;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📍 Simple Location Tracker</h1>
        <p class="subtitle">Get your location every second</p>
        
        <div id="status" class="status">
            Ready to start tracking
        </div>
        
        <div class="buttons">
            <button id="startBtn" class="start-btn">Start Tracking</button>
            <button id="stopBtn" class="stop-btn" disabled>Stop Tracking</button>
        </div>
        
        <div class="location-box">
            <div class="coordinate">
                <span class="label">Latitude:</span>
                <span id="latitude" class="value loading">--</span>
            </div>
            <div class="coordinate">
                <span class="label">Longitude:</span>
                <span id="longitude" class="value loading">--</span>
            </div>
            <div class="coordinate">
                <span class="label">Accuracy:</span>
                <span id="accuracy" class="value loading">--</span>
            </div>
            <div class="coordinate">
                <span class="label">Last Update:</span>
                <span id="timestamp" class="value loading">--</span>
            </div>
        </div>
        
        <div class="stats">
            <div class="stat-item">
                <div id="updateCount" class="stat-value">0</div>
                <div class="stat-label">Updates</div>
            </div>
            <div class="stat-item">
                <div id="frequency" class="stat-value">1s</div>
                <div class="stat-label">Frequency</div>
            </div>
            <div class="stat-item">
                <div id="support" class="stat-value">✓</div>
                <div class="stat-label">Supported</div>
            </div>
        </div>
        
        <div class="debug">
            <h3>📝 Debug Log</h3>
            <div id="log" class="log">
                <div class="log-entry">
                    <span class="log-time">[System]:</span>
                    <span class="log-message">Location tracker loaded</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Simple state management
        let isTracking = false;
        let watchId = null;
        let updateCount = 0;
        
        // Get DOM elements
        const statusEl = document.getElementById('status');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const latitudeEl = document.getElementById('latitude');
        const longitudeEl = document.getElementById('longitude');
        const accuracyEl = document.getElementById('accuracy');
        const timestampEl = document.getElementById('timestamp');
        const updateCountEl = document.getElementById('updateCount');
        const logEl = document.getElementById('log');
        const supportEl = document.getElementById('support');
        
        // Check if geolocation is supported
        function checkSupport() {
            if (!navigator.geolocation) {
                statusEl.textContent = "Geolocation not supported by your browser";
                statusEl.className = "status status-error";
                startBtn.disabled = true;
                supportEl.textContent = "✗";
                supportEl.style.color = "#dc3545";
                addLog("Error: Geolocation not supported");
                return false;
            }
            addLog("Geolocation is supported");
            return true;
        }
        
        // Update the display with position data
        function updateDisplay(position) {
            updateCount++;
            
            // Update coordinates
            latitudeEl.textContent = position.coords.latitude.toFixed(6);
            longitudeEl.textContent = position.coords.longitude.toFixed(6);
            accuracyEl.textContent = `${Math.round(position.coords.accuracy)} meters`;
            
            // Update timestamp
            const now = new Date();
            timestampEl.textContent = now.toLocaleTimeString();
            
            // Update counter
            updateCountEl.textContent = updateCount;
            
            return now;
        }
        
        // Start tracking location
        function startTracking() {
            if (!checkSupport()) return;
            
            if (isTracking) return;
            
            addLog("Starting location tracking...");
            statusEl.textContent = "Getting initial location...";
            
            // First get immediate position
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    // Got initial position - show it immediately
                    const timestamp = updateDisplay(position);
                    addLog(`Initial location: ${position.coords.latitude.toFixed(4)}, ${position.coords.longitude.toFixed(4)}`);
                    
                    // Now start continuous tracking
                    isTracking = true;
                    startBtn.disabled = true;
                    stopBtn.disabled = false;
                    
                    // Start watching position for updates
                    watchId = navigator.geolocation.watchPosition(
                        (pos) => {
                            const time = updateDisplay(pos);
                            // Log only every 3 updates to avoid spam
                            if (updateCount % 3 === 0) {
                                addLog(`Update #${updateCount}: ${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)}`);
                            }
                        },
                        handleError,
                        {
                            enableHighAccuracy: true,
                            maximumAge: 0,
                            timeout: 10000  // 10 second timeout
                        }
                    );
                    
                    statusEl.textContent = "📍 Tracking active - Updating every second";
                    statusEl.className = "status status-active";
                    addLog("Continuous tracking started");
                },
                (error) => {
                    // Permission denied or error getting initial position
                    handleError(error);
                    addLog("Failed to get initial position");
                },
                {
                    enableHighAccuracy: true,
                    timeout: 15000,  // 15 second timeout for initial position
                    maximumAge: 0
                }
            );
        }
        
        // Handle errors
        function handleError(error) {
            let message = "";
            
            switch(error.code) {
                case 1: // PERMISSION_DENIED
                    message = "Location permission denied. Please enable location access in your browser settings.";
                    break;
                case 2: // POSITION_UNAVAILABLE
                    message = "Location information unavailable. Make sure location services are enabled on your device.";
                    break;
                case 3: // TIMEOUT
                    message = "Location request timed out. Please try again.";
                    break;
                default:
                    message = "Unknown error getting location.";
            }
            
            statusEl.textContent = `Error: ${message}`;
            statusEl.className = "status status-error";
            addLog(`Error: ${message} (Code: ${error.code})`);
            
            // Stop tracking if there's an error
            if (isTracking) {
                stopTracking();
            }
        }
        
        // Stop tracking
        function stopTracking() {
            if (watchId) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }
            
            isTracking = false;
            startBtn.disabled = false;
            stopBtn.disabled = true;
            
            statusEl.textContent = "Tracking stopped";
            statusEl.className = "status";
            addLog("Tracking stopped");
        }
        
        // Add message to debug log
        function addLog(message) {
            const now = new Date();
            const time = now.toLocaleTimeString();
            
            const logEntry = document.createElement('div');
            logEntry.className = 'log-entry';
            logEntry.innerHTML = `<span class="log-time">[${time}]:</span> <span class="log-message">${message}</span>`;
            
            logEl.appendChild(logEntry);
            
            // Keep only last 10 logs
            while (logEl.children.length > 10) {
                logEl.removeChild(logEl.firstChild);
            }
            
            // Scroll to bottom
            logEl.scrollTop = logEl.scrollHeight;
        }
        
        // Set up event listeners
        startBtn.addEventListener('click', startTracking);
        stopBtn.addEventListener('click', stopTracking);
        
        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            checkSupport();
            addLog("Ready to start tracking");
        });
    </script>
</body>
</html>
