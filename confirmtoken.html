<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMProb - Email Verification</title>
<style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #F5F7FA 0%, #E4E9F2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #2C3E50;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(37, 159, 222, 0.15);
            padding: 40px;
            width: 100%;
            max-width: 450px;
            border: 2px solid rgba(37, 159, 222, 0.2);
            text-align: center;
            position: relative;
        }
        
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(135deg, #259FDE 0%, #0E3CBD 100%);
            border-radius: 20px 20px 0 0;
        }
        
        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .logo {
            width: 100px;
            height: 100px;
            object-fit: contain;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(37, 159, 222, 0.1) 0%, rgba(14, 60, 189, 0.1) 100%);
            padding: 10px;
            border: 3px solid white;
            outline: 2px solid rgba(37, 159, 222, 0.3);
            box-shadow: 0 8px 25px rgba(37, 159, 222, 0.2);
        }
        
        .site-name {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #259FDE 0%, #0E3CBD 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
            margin-bottom: 5px;
        }
        
        h1 { 
            color: #2C3E50; 
            margin-bottom: 20px; 
            font-size: 24px;
            font-weight: 700;
        }
        
        .message {
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
            font-weight: 500;
        }
        
        .success { 
            background: rgba(46, 204, 113, 0.1); 
            border: 2px solid #2ECC71; 
            color: #2ECC71;
        }
        
        .error { 
            background: rgba(231, 76, 60, 0.1); 
            border: 2px solid #E74C3C; 
            color: #E74C3C;
        }
        
        .loading { 
            background: rgba(37, 159, 222, 0.1); 
            border: 2px solid #259FDE; 
            color: #259FDE;
        }
        
        .user-info {
            background: rgba(37, 159, 222, 0.05);
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
            text-align: left;
            border: 2px solid rgba(37, 159, 222, 0.2);
        }
        
        .user-info p { 
            margin: 8px 0; 
            color: #7F8C8D; 
        }
        
        .user-info strong { 
            color: #2C3E50; 
            font-weight: 600;
        }
        
        button {
            padding: 16px 32px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #259FDE 0%, #0E3CBD 100%);
            color: white;
            width: 100%;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(37, 159, 222, 0.2);
        }
        
        button:hover { 
            transform: translateY(-3px); 
            box-shadow: 0 10px 25px rgba(37, 159, 222, 0.3); 
        }
        
        button:disabled { 
            opacity: 0.5; 
            cursor: not-allowed; 
            transform: none !important;
            box-shadow: 0 4px 15px rgba(37, 159, 222, 0.2) !important;
        }
        
        .redirect-btn {
            background: white;
            color: #259FDE;
            border: 2px solid #259FDE;
            margin-top: 10px;
        }
        
        .redirect-btn:hover { 
            background: linear-gradient(135deg, #259FDE 0%, #0E3CBD 100%);
            color: white;
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
                border-radius: 15px;
            }
            
            .logo {
                width: 90px;
                height: 90px;
            }
            
            .site-name {
                font-size: 28px;
            }
            
            h1 {
                font-size: 22px;
            }
            
            .message {
                padding: 15px;
            }
            
            .user-info {
                padding: 15px;
            }
            
            button {
                padding: 14px;
                font-size: 15px;
            }
        }
        
        @media (max-width: 360px) {
            .container {
                padding: 25px 15px;
            }
            
            .logo {
                width: 80px;
                height: 80px;
            }
            
            .site-name {
                font-size: 24px;
            }
            
            h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <img src="https://iili.io/fnM2iqx.png" alt="EMProb Logo" class="logo" onerror="this.style.display='none';">
            <div class="site-name">EMProb</div>
        </div>
        <h1>Email Verification</h1>

        <div id="loadingMessage" class="message loading">
            Verifying your email token...
        </div>

        <div id="successMessage" class="message success" style="display: none;">
            <h3>Email Verified Successfully!</h3>
            <p>Your account has been created. You can now login.</p>
            <div id="userInfo" class="user-info" style="display: none;"></div>
            <button onclick="window.location.href='/'">Go to Login</button>
        </div>

        <div id="errorMessage" class="message error" style="display: none;">
            <h3>Verification Failed</h3>
            <p id="errorText"></p>
            <button class="redirect-btn" onclick="window.location.href='/'">Go to Registration</button>
        </div>
    </div>

    <!-- Firebase SDK (v9 Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
        import { getDatabase, ref, get, set, remove } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-database.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBGONaynbM6GSdq4Ee46dD8tqfeCYx-w-M",
            authDomain: "probationlocator.firebaseapp.com",
            databaseURL: "https://probationlocator-default-rtdb.firebaseio.com",
            projectId: "probationlocator",
            storageBucket: "probationlocator.firebasestorage.app",
            messagingSenderId: "323066331183",
            appId: "1:323066331183:web:61f35b70cb07c0618106da"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);
        const auth = getAuth(app);

        // Get token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        // Start anonymous auth
        signInAnonymously(auth)
            .then(() => {
                console.log("Anonymous auth successful");
                if (!token) {
                    showError("No verification token found in the URL.");
                    return;
                }
                verifyToken(token);
            })
            .catch(err => {
                console.error("Anonymous auth failed:", err);
                showError("Authentication failed. Please try again later.");
            });

        async function verifyToken(token) {
            const tokenRef = ref(database, 'registertoken/' + token);

            try {
                const snapshot = await get(tokenRef);

                if (!snapshot.exists()) {
                    return showError("Invalid or expired verification token.");
                }

                const tokenData = snapshot.val();

                // Check expiration
                if (Date.now() > tokenData.expiresAt) {
                    await remove(tokenRef); // clean up expired token
                    return showError("This verification link has expired. Please register again.");
                }

                // Already verified?
                if (tokenData.verified) {
                    return showError("This token has already been used.");
                }

                // Check if username already taken
                const userRef = ref(database, 'credentials/' + tokenData.username);
                const userSnap = await get(userRef);
                if (userSnap.exists()) {
                    return showError("Username already exists. Please choose another.");
                }

                // Check if email already registered
                if (await checkEmailExists(tokenData.email)) {
                    return showError("This email is already registered.");
                }

                // === CREATE USER ACCOUNT ===
                await set(userRef, {
                    username: tokenData.username,
                    email: tokenData.email,
                    password: tokenData.password,        // Note: in production you should hash this!
                    fullName: tokenData.fullName,
                    address: tokenData.address,
                    phone: tokenData.phone,
                    createdAt: new Date().toISOString(),
                    lastLogin: null,
                    emailVerified: true
                });

                // Mark as verified (optional, since we delete it right after)
                await set(ref(database, 'registertoken/' + token + '/verified'), true);

                // === SUCCESS: Show user info ===
                showSuccess(tokenData);

                // === CRITICAL: DELETE THE TOKEN (contains plaintext password!) ===
                await remove(tokenRef);
                console.log("Verification token successfully deleted:", token);

            } catch (err) {
                console.error("Verification error:", err);
                showError("An unexpected error occurred. Please try again.");
            }
        }

        async function checkEmailExists(email) {
            const usersRef = ref(database, 'credentials');
            const snap = await get(usersRef);
            if (!snap.exists()) return false;

            const users = snap.val();
            return Object.values(users).some(u => u.email === email);
        }

        function showSuccess(userData) {
            document.getElementById('loadingMessage').style.display = 'none';
            document.getElementById('successMessage').style.display = 'block';
            document.getElementById('userInfo').style.display = 'block';

            document.getElementById('userInfo').innerHTML = `
                <p><strong>Username:</strong> ${userData.username}</p>
                <p><strong>Email:</strong> ${userData.email}</p>
                <p><strong>Full Name:</strong> ${userData.fullName || '—'}</p>
                <p><strong>Phone:</strong> ${userData.phone || '—'}</p>
                <p><strong>Address:</strong> ${userData.address || '—'}</p>
            `;
        }

        function showError(message) {
            document.getElementById('loadingMessage').style.display = 'none';
            document.getElementById('errorMessage').style.display = 'block';
            document.getElementById('errorText').textContent = message;
        }
    </script>
</body>
</html>
